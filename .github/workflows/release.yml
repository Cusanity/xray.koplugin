# Release workflow — triggered by pushing a version tag: git tag v2.0.1 && git push origin v2.0.1
#
# Produces one release asset:
#   xray.koplugin-v*.*.*.zip   — KOReader device-side plugin (Lua only)

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:          # manual trigger for testing builds (creates a draft release)

permissions:
  contents: write             # needed to create/upload the GitHub release

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Package the KOReader plugin (Lua device-side files only)
  # ---------------------------------------------------------------------------
  build-plugin:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            # Manual run: derive version from _meta.lua so the zip is named correctly
            VER=$(grep -oP '(?<=version = ")[^"]+' _meta.lua)
            echo "version=v${VER}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create plugin zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          ZIP="xray.koplugin-${VERSION}.zip"

          # Stage device-side files under xray.koplugin/ so the user can unzip
          # directly into koreader/plugins/ and get the right layout.
          STAGING=$(mktemp -d)
          DEST="${STAGING}/xray.koplugin"
          mkdir -p "${DEST}/languages"

           cp _meta.lua cachemanager.lua chapteranalyzer.lua \
             characternotes.lua \
             localization_xray.lua main.lua sync.lua xray_receiver.lua \
             LICENSE "${DEST}/"
          cp languages/*.po   "${DEST}/languages/"

          (cd "${STAGING}" && zip -r "${GITHUB_WORKSPACE}/${ZIP}" xray.koplugin/)

          echo "ZIP=${ZIP}" >> "$GITHUB_ENV"
          echo "Created ${ZIP} ($(du -sh "$ZIP" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip
          path: xray.koplugin-*.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 2: Create the GitHub release and attach plugin artifact
  # ---------------------------------------------------------------------------
  release:
    needs: [build-plugin]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts      # downloads all artifacts into artifacts/<name>/

      - name: List artifacts
        run: find artifacts -type f

      - name: Build release notes
        run: |
          VERSION="${{ needs.build-plugin.outputs.version }}"
          ASSET_NAME="xray.koplugin-${VERSION}.zip"
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_SUBJECT=$(git log -1 --pretty=%s)
          COMMIT_MSG=$(git log -1 --pretty=%B)
          {
            printf '# X-Ray Plugin %s\n\n' "$VERSION"
            printf '> Commit: `%s`  \n' "$COMMIT_SHA"
            printf '> Subject: %s\n\n' "$COMMIT_SUBJECT"
            printf '## What\x27s Changed\n\n'
            if [[ -n "$COMMIT_MSG" ]]; then
              printf '%s\n\n' "$COMMIT_MSG"
            else
              printf '(No commit message provided.)\n\n'
            fi
          } > release_notes.md

          sed "s/ASSET_PLACEHOLDER/${ASSET_NAME}/g" .github/release_notes_installation.md >> release_notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-plugin.outputs.version }}
          name: "X-Ray Plugin ${{ needs.build-plugin.outputs.version }}"
          draft: ${{ github.event_name == 'workflow_dispatch' }}
          prerelease: ${{ contains(needs.build-plugin.outputs.version, '-') }}
          files: |
            artifacts/plugin-zip/xray.koplugin-*.zip
          body_path: release_notes.md
